name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.3', '8.2', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, posix, json
          coverage: none
      - name: PHP syntax lint
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          php -l pikkumies/bin/pikkumies > /dev/null
      - name: Tests
        run: php tests/run.php
