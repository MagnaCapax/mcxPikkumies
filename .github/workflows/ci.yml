name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.3', '8.2', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, posix, json, sodium
          coverage: none
      - name: PHP syntax lint
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          php -l pikkumies/bin/pikkumies > /dev/null
      - name: Tests
        run: php tests/run.php
      - name: Tests left tracked files unchanged
        run: |
          git status --porcelain --untracked-files=no > /tmp/changed.txt
          if [ -s /tmp/changed.txt ]; then cat /tmp/changed.txt; exit 1; fi
